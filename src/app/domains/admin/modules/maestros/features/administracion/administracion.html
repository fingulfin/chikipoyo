<div class="p-6 sm:p-12">
  <mat-card>
    <h2 class="text-2xl font-bold">Administración</h2>
    <p class="mt-2 text-neutral-500">
      Gestión de maestros. Esta sección está en construcción.
    </p>

<mat-tab-group class="mt-6">
      <mat-tab label="Actualizar">
        <div class="py-4">
          <h3 class="text-lg font-semibold">Actualiar maestros</h3>
          <p class="mt-2 text-neutral-500">
            Actualizar la información de los maestros.
          </p>

          <form class="mt-6 flex flex-col gap-y-4" (submit)="$event.preventDefault(); updateUser()">
            <mat-form-field class="w-full">
              <mat-label>Nombre</mat-label>
              <input matInput [value]="user()?.name ?? ''" (input)="updateField('name', $event)" />
            </mat-form-field>

            <mat-form-field class="w-full">
              <mat-label>Nombre de usuario</mat-label>
              <input matInput [value]="user()?.username ?? ''" (input)="updateField('username', $event)" />
            </mat-form-field>

            <mat-form-field class="w-full">
              <mat-label>Correo electronico</mat-label>
              <input matInput [value]="user()?.email ?? ''" [disabled]="true" />
            </mat-form-field>

            <button mat-flat-button type="submit" [disabled]="!user() || saving()">
              {{ saving() ? 'Actualizando...' : 'Actualizar datos' }}
            </button>
          </form>
        </div>
      </mat-tab>

    
    </mat-tab-group>
  </mat-card>
</div>
